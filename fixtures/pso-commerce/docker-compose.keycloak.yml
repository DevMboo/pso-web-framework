# DEVELOPMENT AND TESTING ONLY. A disposable Keycloak as the real, standards-compliant OpenID Connect provider of the Commerce stack.
# Keycloak is NOT a dependency of the PSO framework: any OIDC provider works the same way (issuer, JWKS, audience).
#   docker compose --env-file .env.keycloak -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.keycloak.yml up -d
# .env.keycloak = .env with the PSO_JWT_* variables pointing at this realm, and ANA_PASSWORD / VERA_PASSWORD / NOBODY_PASSWORD / KC_ADMIN_PASSWORD
# (generated by scripts, never committed). The certificate is tls/keycloak (pso tls:init --dev --hosts keycloak): the same private CA that the
# services already trust, so the orchestrator fetches the realm's keys over verified TLS.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm", "--hostname=https://keycloak:8443", "--http-enabled=false", "--https-port=8443", "--https-certificate-file=/run/pso/tls/tls.crt", "--https-certificate-key-file=/run/pso/tls/tls.key", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}"
      ANA_PASSWORD: "${ANA_PASSWORD:?}"
      VERA_PASSWORD: "${VERA_PASSWORD:?}"
      NOBODY_PASSWORD: "${NOBODY_PASSWORD:?}"
    volumes:
      - ./keycloak/pso-realm.json:/opt/keycloak/data/import/pso-realm.json:ro
      - ${PSO_TLS_DIR:-./tls}/keycloak:/run/pso/tls:ro
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      internal:
        aliases: [keycloak]
