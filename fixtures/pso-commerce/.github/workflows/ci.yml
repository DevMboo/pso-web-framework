# Generated by `pso docker:init`.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --prefix gateway
      - run: npx --prefix gateway tsc --noEmit -p gateway
      - run: npm audit --omit=dev --audit-level=high --prefix gateway
  spring:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [customers, catalog, orders]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify
        working-directory: ${{ matrix.service }}
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
