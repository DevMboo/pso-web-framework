# Generated by `pso docker:init`. Secrets are never stored here: values come from the environment / .env (see .env.example).
#
# Upstream transport: TLS. The orchestrator reaches customers, catalog, orders over HTTPS and verifies each certificate (issuing
# authority and host name; verification cannot be switched off). The certificates are read from PSO_TLS_DIR (default ./tls):
#   ca.crt   <service>/tls.crt   <service>/tls.key   <service>/ca.crt
# Development: `pso tls:init --dev` creates them. Production: put the certificates of your own certificate authority there
# (each service certificate must name the service, e.g. "catalog", and "localhost" for the container health check), then
# `pso tls:check`. Mutual TLS: add PSO_UPSTREAM_<NAME>_TLS_CERT_FILE / _TLS_KEY_FILE in docker-compose.override.yml.
x-pso-env: &pso-env
  PSO_JWT_ISSUER: ${PSO_JWT_ISSUER:?set PSO_JWT_ISSUER}
  PSO_JWT_AUDIENCE: ${PSO_JWT_AUDIENCE:?set PSO_JWT_AUDIENCE}
  PSO_JWT_JWKS_URI: ${PSO_JWT_JWKS_URI:?set PSO_JWT_JWKS_URI}
  PSO_JWT_ALGORITHMS: ${PSO_JWT_ALGORITHMS:-ES256}
  # an identity provider on a private network or with a private certificate authority (empty = not used; see .env.example)
  PSO_JWT_JWKS_PRIVATE_HOSTS: ${PSO_JWT_JWKS_PRIVATE_HOSTS:-}
  PSO_JWT_JWKS_CA_FILE: ${PSO_JWT_JWKS_CA_FILE:-}
  # the same two settings under the names the Spring services bind (pso.security.jwt.ca-file, pso.security.jwt.private-hosts)
  PSO_SECURITY_JWT_CA_FILE: ${PSO_JWT_JWKS_CA_FILE:-}
  PSO_SECURITY_JWT_PRIVATE_HOSTS: ${PSO_JWT_JWKS_PRIVATE_HOSTS:-}

services:
  customers:
    build: ./customers
    restart: unless-stopped
    user: "${PSO_CONTAINER_USER:-10001}"
    environment:
      <<: *pso-env
      PORT: "8081"
      HOST: "0.0.0.0"
      SERVER_SSL_CERTIFICATE: file:/run/pso/tls/tls.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: file:/run/pso/tls/tls.key
    volumes:
      - ${PSO_TLS_DIR:-./tls}/customers:/run/pso/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /run/pso/tls/ca.crt https://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    stop_grace_period: "${PSO_STOP_GRACE_PERIOD:-40s}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  catalog:
    build: ./catalog
    restart: unless-stopped
    user: "${PSO_CONTAINER_USER:-10001}"
    environment:
      <<: *pso-env
      PORT: "8082"
      HOST: "0.0.0.0"
      SERVER_SSL_CERTIFICATE: file:/run/pso/tls/tls.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: file:/run/pso/tls/tls.key
    volumes:
      - ${PSO_TLS_DIR:-./tls}/catalog:/run/pso/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /run/pso/tls/ca.crt https://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    stop_grace_period: "${PSO_STOP_GRACE_PERIOD:-40s}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  orders:
    build: ./orders
    restart: unless-stopped
    user: "${PSO_CONTAINER_USER:-10001}"
    environment:
      <<: *pso-env
      PORT: "8083"
      HOST: "0.0.0.0"
      SERVER_SSL_CERTIFICATE: file:/run/pso/tls/tls.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: file:/run/pso/tls/tls.key
    volumes:
      - ${PSO_TLS_DIR:-./tls}/orders:/run/pso/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /run/pso/tls/ca.crt https://localhost:8083/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    stop_grace_period: "${PSO_STOP_GRACE_PERIOD:-40s}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  gateway:
    build: ./gateway
    restart: unless-stopped
    user: "${PSO_CONTAINER_USER:-node}"
    environment:
      <<: *pso-env
      PORT: "3000"
      HOST: "0.0.0.0"
      PSO_SHUTDOWN_GRACE_MS: "${PSO_SHUTDOWN_GRACE_MS:-5000}"
      PSO_UPSTREAM_CUSTOMERS: "customers:8081"
      PSO_UPSTREAM_CUSTOMERS_PREFIX: "/customers"
      PSO_UPSTREAM_CUSTOMERS_TLS: "true"
      PSO_UPSTREAM_CUSTOMERS_TLS_CA_FILE: /run/pso/tls/ca.crt
      PSO_UPSTREAM_CATALOG: "catalog:8082"
      PSO_UPSTREAM_CATALOG_PREFIX: "/catalog"
      PSO_UPSTREAM_CATALOG_TLS: "true"
      PSO_UPSTREAM_CATALOG_TLS_CA_FILE: /run/pso/tls/ca.crt
      PSO_UPSTREAM_ORDERS: "orders:8083"
      PSO_UPSTREAM_ORDERS_PREFIX: "/orders"
      PSO_UPSTREAM_ORDERS_TLS: "true"
      PSO_UPSTREAM_ORDERS_TLS_CA_FILE: /run/pso/tls/ca.crt
    volumes:
      - ${PSO_TLS_DIR:-./tls}/ca.crt:/run/pso/tls/ca.crt:ro
    stop_grace_period: "${PSO_STOP_GRACE_PERIOD:-40s}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      customers:
        condition: service_healthy
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy

networks:
  internal:
    driver: bridge
