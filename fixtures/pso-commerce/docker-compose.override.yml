# Infrastructure of this deployment (written by the application team, not generated by PSO). Secrets come from .env.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: commerce, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}" }
    volumes:
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U commerce -d orders"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [internal]
  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment: { RABBITMQ_DEFAULT_USER: commerce, RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}" }
    healthcheck: { test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"], interval: 5s, timeout: 5s, retries: 40, start_period: 20s }
    networks: [internal]
  customers:
    environment: { DB_URL: "jdbc:postgresql://postgres:5432/customers", DB_USER: commerce, DB_PASSWORD: "${DB_PASSWORD:?}" }
    depends_on: { postgres: { condition: service_healthy } }
  catalog:
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/catalog"
      DB_USER: commerce
      DB_PASSWORD: "${DB_PASSWORD:?}"
      PSO_DISPATCH_ENABLED: "true"
      PSO_DISPATCH_TRUST_MODE: required          # only signed events of known services are handled
      PSO_DISPATCH_SIGNING_KEY: "${CATALOG_DISPATCH_KEY:?}"
      PSO_DISPATCH_TRUST_KEY_ORDERS: "${ORDERS_DISPATCH_KEY:?}"   # the publisher this service verifies
      RABBITMQ_URL: "amqp://commerce:${RABBITMQ_PASSWORD:?}@rabbitmq:5672"
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
  orders:
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/orders"
      DB_USER: commerce
      DB_PASSWORD: "${DB_PASSWORD:?}"
      PSO_DISPATCH_ENABLED: "true"
      PSO_DISPATCH_TRUST_MODE: required
      PSO_DISPATCH_SIGNING_KEY: "${ORDERS_DISPATCH_KEY:?}"
      RABBITMQ_URL: "amqp://commerce:${RABBITMQ_PASSWORD:?}@rabbitmq:5672"
      CUSTOMERS_URL: "https://customers:8081/customers"
      CATALOG_URL: "https://catalog:8082/catalog"
      PSO_TLS_CA_FILE: /run/pso/tls/ca.crt
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
volumes:
  pgdata:
