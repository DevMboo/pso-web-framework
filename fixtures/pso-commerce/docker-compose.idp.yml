# DEVELOPMENT ONLY. Generated by `pso idp:dev init`: the development identity provider of this workspace.
# Use it together with the generated deployment:
#   docker compose -f docker-compose.yml -f docker-compose.idp.yml up -d --wait
# It serves the PUBLIC keys of ./idp/jwks.json over HTTPS with the certificate of ./tls/idp (pso tls:init --dev --hosts idp).
# The private signing key stays on this machine (./idp/keys, git-ignored) and is never mounted. A production deployment does not
# include this file and points PSO_JWT_* at the real identity provider.
services:
  idp:
    image: node:24-alpine
    command: ["node", "/idp/dev-idp.cjs"]
    environment:
      IDP_PORT: "8443"
      IDP_CERT: /run/pso/tls/tls.crt
      IDP_KEY: /run/pso/tls/tls.key
    volumes:
      - ./idp/dev-idp.cjs:/idp/dev-idp.cjs:ro
      - ./idp/jwks.json:/idp/jwks.json:ro
      - ${PSO_TLS_DIR:-./tls}/idp:/run/pso/tls:ro
    user: "${PSO_CONTAINER_USER:-1000:1000}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:https').get({host:'localhost',port:8443,path:'/healthz',ca:require('node:fs').readFileSync('/run/pso/tls/ca.crt')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
  gateway:
    depends_on:
      idp:
        condition: service_healthy
  customers:
    depends_on:
      idp:
        condition: service_healthy
  catalog:
    depends_on:
      idp:
        condition: service_healthy
  orders:
    depends_on:
      idp:
        condition: service_healthy
