# Main configuration of the PSO edge image. The environment's routing (server blocks) is the generated file mounted at
# /etc/nginx/conf.d/default.conf (.infra/nginx/<env>/edge.conf). The container runs unprivileged on a read-only root file system:
# everything nginx writes goes to /tmp (memory-only).
load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Nothing that identifies the edge's software, or an upstream's, leaves it. This applies to every response, including the ones nginx
    # generates itself (errors, plain HTTP on the TLS port). The version is also hidden by server_tokens in the generated configuration.
    more_clear_headers Server X-Powered-By X-AspNet-Version X-AspNetMvc-Version;

    # Internal diagnostics stay in the container log (pso docker:logs edge): the request path without its query string (which may carry an
    # authorization code or a token), the status, the upstream that answered and the id that edge-generated errors return as X-Correlation-ID.
    map $request_uri $edge_path { "~^(?<p>[^?]*)" $p; default $request_uri; }
    log_format edge '$remote_addr [$time_iso8601] "$request_method $edge_path $server_protocol" $status $body_bytes_sent $request_time host=$host upstream=$upstream_addr upstream_status=$upstream_status id=$request_id';
    access_log /dev/stdout edge;

    include /etc/nginx/conf.d/*.conf;
}
