<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>:root{--bg:#f6f6f7;--fg:#18181b;--muted:#52525b;--line:#dcdce0;--accent:#1d4ed8}@media (prefers-color-scheme:dark){:root{--bg:#111113;--fg:#f4f4f5;--muted:#a1a1aa;--line:#2e2e33;--accent:#9db8ff}}*{box-sizing:border-box}html{height:100%}body{min-height:100%;margin:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}main{width:100%;max-width:34rem}.code{margin:0 0 10px;font-size:.8125rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}h1{margin:0 0 12px;font-size:clamp(1.625rem,5vw,2.125rem);line-height:1.2;font-weight:650;letter-spacing:-.01em}p{margin:0;color:var(--muted)}nav{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px}a{color:var(--accent);font-weight:550;text-decoration:none;text-underline-offset:3px}a:hover{text-decoration:underline}a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}</style>
</head>
<body>
<main>
<p class="code">Error {{code}}</p>
<h1>{{title}}</h1>
<p>{{message}}</p>
{{nav}}
</main>
</body>
</html>
